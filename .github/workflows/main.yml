name: Coursework CI

on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Check Python files
        run: python -m py_compile main.py calculator.py

      - name: Say hello
        run: echo "Coursework CI completed successfully!"
